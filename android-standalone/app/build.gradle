plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'ai.wormwright.pocket'
    compileSdk 36
    defaultConfig {
        applicationId 'ai.wormwright.vault.standalone'
        minSdk 30
        targetSdk 36
        versionCode 24
        versionName '0.1.0-test.24'
        testInstrumentationRunner 'ai.wormwright.pocket.UiRegressionInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    signingConfigs {
        pocketTest {
            def source = System.getenv('WORMWRIGHT_TEST_SIGNING')
            if (source) {
                def values = new Properties(); values.load(new File(source).newInputStream())
                storeFile new File(values.getProperty('storeFile'))
                storePassword values.getProperty('storePassword')
                keyAlias values.getProperty('keyAlias'); keyPassword values.getProperty('keyPassword')
            }
        }
        publisher {
            def source = System.getenv('WORMWRIGHT_RELEASE_SIGNING')
            if (source) {
                def values = new Properties(); values.load(new File(source).newInputStream())
                storeFile new File(values.getProperty('storeFile'))
                storePassword values.getProperty('storePassword')
                keyAlias values.getProperty('keyAlias'); keyPassword values.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { if (System.getenv('WORMWRIGHT_TEST_SIGNING')) signingConfig signingConfigs.pocketTest }
        release { minifyEnabled false; if (System.getenv('WORMWRIGHT_RELEASE_SIGNING')) signingConfig signingConfigs.publisher }
    }
    sourceSets { main.java.srcDirs += ["../../android-shared/src/main/java"]; test.java.srcDirs += ["../../android-shared/src/test/java"]; main.python.srcDirs += ["../../android-shared/python"] }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation "com.hierynomus:smbj:0.14.0"
    testImplementation "org.json:json:20240303"
    implementation "com.yubico.yubikit:android:2.9.0"
    implementation "com.yubico.yubikit:fido:2.9.0"
    implementation "org.slf4j:slf4j-nop:2.0.9"
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'junit:junit:4.13.2'
}
chaquopy {
    defaultConfig {
        version = '3.13'
        buildPython System.getenv('WORMWRIGHT_BUILD_PYTHON') ?: 'python3'
        pip { install 'PyNaCl==1.5.0'; install 'cffi==1.17.1'; install 'pycparser==3.11'; install 'chaquopy-libffi==3.3' }
    }
}
