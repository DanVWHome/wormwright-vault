plugins { id 'com.android.application' }
android {
 namespace 'ai.wormwright.notes'
 compileSdk 35
 defaultConfig { applicationId 'ai.wormwright.notes'; testInstrumentationRunner 'ai.wormwright.notes.SecretUiInstrumentation'; minSdk 26; targetSdk 35; versionCode 9; versionName 'Release 8' }
 testOptions { unitTests.includeAndroidResources = true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation fileTree(dir: 'libs', include: ['*.jar']); testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.16.1' }
