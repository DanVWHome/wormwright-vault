name: Build view-only desktop installers 0.3.12
on:
  workflow_dispatch:
  push:
    branches: ['builds/view-only-0.3.12']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python tests/run_portable_checks.py
      - run: python -m unittest discover -s tests/multikey -p "test_*.py"
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python packaging/build-windows.py
      - run: python tests/smoke_windows_bundle.py build-windows/bundle/WormwrightVault/WormwrightVault.exe
      - name: Compile installer
        shell: pwsh
        run: |
          New-Item installer-input -ItemType Directory -Force
          Copy-Item build-windows/bundle/WormwrightVault installer-input/WormwrightVault -Recurse -Force
          $compiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' } }
          & $compiler packaging/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - run: python tests/check_windows_icons.py build-windows/bundle/WormwrightVault/WormwrightVault.exe dist-installer/wormwright-vault_0.3.12_windows_x64_setup.exe
      - run: python tests/check_windows_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview-0.3.12
          path: |
            dist-windows/*.zip
            dist-installer/*_setup.exe
          if-no-files-found: error
  fedora:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging and Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libasound2t64
      - run: python -m pip install -r requirements-build.txt
      - run: python tests/run_portable_checks.py
      - run: python -m unittest discover -s tests/multikey -p "test_*.py"
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python packaging/build-fedora.py --work-dir build-fedora --output-dir dist-fedora
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Verify RPM metadata and absence of personal data
        run: |
          rpm -qp --queryformat '%{NAME} %{VERSION} %{ARCH}\n' dist-fedora/x86_64/*.rpm | tee rpm-metadata.txt
          test "$(cat rpm-metadata.txt)" = 'wormwright-vault 0.3.12 x86_64'
          rpm -qpl dist-fedora/x86_64/*.rpm > rpm-files.txt
          test -z "$(rg '\.(jks|keystore|sqlite|db)$' rpm-files.txt | rg -v '/assets/demo/wormwright-demo.sqlite$' || true)"
      - name: Install, start, upgrade and remove inside Fedora 44
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work fedora:44 bash -euxc '
            export QT_QPA_PLATFORM=offscreen
            dnf install -y /work/dist-fedora/x86_64/*.rpm
            QT_QPA_PLATFORM=offscreen /usr/bin/wormwright-vault --check-yubikey-runtime
            python3 tests/smoke_linux_bundle.py /usr/bin/wormwright-vault
            dnf reinstall -y /work/dist-fedora/x86_64/*.rpm
            python3 tests/smoke_linux_bundle.py /usr/bin/wormwright-vault
            dnf remove -y wormwright-vault
            test ! -e /usr/bin/wormwright-vault
          '
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-preview-0.3.12
          path: dist-fedora/x86_64/*.rpm
          if-no-files-found: error
