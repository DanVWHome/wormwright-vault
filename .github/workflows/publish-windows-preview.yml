name: Publish Windows tutorial update
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require successful native build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/DanVWHome/wormwright-vault/actions/runs/38163471484 --jq .conclusion)" = success
          test "$(gh api repos/DanVWHome/wormwright-vault/actions/runs/38163471484 --jq .head_sha)" = 27059443566a42368e122c0e444a27a40347695b
      - uses: actions/download-artifact@v4
        with:
          name: wormwright-vault-windows-0.3.8
          path: artifact
          run-id: 38163471484
          github-token: ${{ github.token }}
      - name: Verify tutorial and assemble release
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, hashlib, zipfile, subprocess
          out=Path('candidate');out.mkdir()
          for p in Path('artifact').rglob('*'):
              if p.is_file(): shutil.copy2(p,out/p.name)
          package=out/'wormwright-vault_0.3.8_windows_x64_preview1.zip'
          assert hashlib.sha256(package.read_bytes()).hexdigest()==(out/(package.name+'.sha256')).read_text().split()[0]
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None
              name=next(n for n in z.namelist() if n.endswith('/assets/tutorial/wormwright-vault-tutorial.mp4'))
              assert hashlib.sha256(z.read(name)).digest()==hashlib.sha256(Path('assets/tutorial/wormwright-vault-tutorial.mp4').read_bytes()).digest()
          assert (out/'wormwright-vault_0.3.8_windows_x64_preview1_setup.exe').stat().st_size>1000000
          subprocess.run(['git','archive','--format=zip','--prefix=wormwright-vault/','--output='+str(out/'wormwright-vault-0.3.8-windows-source.zip'),'HEAD'],check=True)
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.name!='SHA256SUMS'))
          PY
      - name: Publish tested installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.3.8-windows-preview.1 candidate/* --repo DanVWHome/wormwright-vault --target 27059443566a42368e122c0e444a27a40347695b --title "Windows 0.3.8 preview 1" --notes-file docs/RELEASE-0.3.8.md --prerelease --latest=false
