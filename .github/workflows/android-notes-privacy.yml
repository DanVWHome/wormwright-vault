name: Wormwright Notes privacy regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and test migration, encryption, redaction, sharing and backups
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;default;x86_64'
          gradle -p apps/wormwright-notes testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Exercise the real PIN prompt on a disposable Android emulator
        timeout-minutes: 12
        run: |
          sudo chmod a+rw /dev/kvm
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/notes-avd"
          mkdir -p "$ANDROID_AVD_HOME" notes-test-results
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n notes -k 'system-images;android-35;default;x86_64' --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -avd notes -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel on > notes-test-results/emulator.txt 2>&1 &
          adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell svc power stayon true
          adb shell settings put system screen_off_timeout 1800000
          adb shell input keyevent 224
          adb shell input keyevent 82
          # Invented PIN for the isolated emulator only.
          adb shell locksettings set-pin 246813
          adb install apps/wormwright-notes/app/build/outputs/apk/debug/app-debug.apk
          adb install apps/wormwright-notes/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am force-stop com.android.launcher3
          adb shell am instrument -w ai.wormwright.notes.test/ai.wormwright.notes.SecretUiInstrumentation | tee notes-test-results/pin-regression.txt
          grep -q 'PASS real Android credential-only PIN' notes-test-results/pin-regression.txt
          adb pull /sdcard/Android/data/ai.wormwright.notes/files/screenshots/. notes-test-results/
      - name: Retain diagnostics
        if: always()
        run: |
          mkdir -p notes-test-results
          "$ANDROID_HOME/platform-tools/adb" logcat -d > notes-test-results/logcat.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wormwright-notes-privacy-results
          path: |
            notes-test-results/
            apps/wormwright-notes/app/build/test-results/testDebugUnitTest/
          retention-days: 7
