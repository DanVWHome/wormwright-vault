name: Build and publish Fedora 0.3.11 preview 2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fedora:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging and Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libasound2t64
      - run: python -m pip install -r requirements-build.txt
      - run: python tests/run_portable_checks.py
      - run: python -m unittest discover -s tests/multikey -p "test_*.py"
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python packaging/build-fedora.py --work-dir build-fedora --output-dir dist-fedora
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Verify RPM metadata and absence of personal data
        run: |
          rpm -qp --queryformat '%{NAME} %{VERSION} %{ARCH}\n' dist-fedora/x86_64/*.rpm | tee rpm-metadata.txt
          test "$(cat rpm-metadata.txt)" = 'wormwright-vault 0.3.11 x86_64'
          rpm -qpl dist-fedora/x86_64/*.rpm > rpm-files.txt
          test -z "$(rg '\.(jks|keystore|sqlite|db)$' rpm-files.txt | rg -v '/assets/demo/wormwright-demo.sqlite$' || true)"
      - name: Install, start, upgrade and remove inside Fedora 44
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work fedora:44 bash -euxc '
            dnf install -y /work/dist-fedora/x86_64/*.rpm xorg-x11-server-Xvfb
            QT_QPA_PLATFORM=offscreen /usr/bin/wormwright-vault --check-yubikey-runtime
            QT_QPA_PLATFORM=offscreen python3 tests/smoke_linux_bundle.py /usr/bin/wormwright-vault
            QT_QPA_PLATFORM=offscreen python3 tests/smoke_linux_bundle.py /usr/bin/wormwright-vault-manager
            Xvfb :99 -screen 0 1280x800x24 &
            display_pid=$!
            trap "kill $display_pid" EXIT
            for attempt in $(seq 1 50); do test -S /tmp/.X11-unix/X99 && break; sleep 0.2; done
            export DISPLAY=:99
            QT_QPA_PLATFORM=xcb python3 tests/smoke_linux_bundle.py /usr/bin/wormwright-vault
            QT_QPA_PLATFORM=xcb python3 tests/smoke_linux_bundle.py /usr/bin/wormwright-vault-manager
            dnf reinstall -y /work/dist-fedora/x86_64/*.rpm
            QT_QPA_PLATFORM=offscreen python3 tests/smoke_linux_bundle.py /usr/bin/wormwright-vault
            dnf remove -y wormwright-vault
            test ! -e /usr/bin/wormwright-vault
          '
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-preview-0.3.11-revision2
          path: dist-fedora/x86_64/*.rpm
          if-no-files-found: error
  publish:
    needs: fedora
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fedora-preview-0.3.11-revision2
          path: release-fedora
      - name: Publish validated Fedora package and exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/publish-fedora-revision2.py
