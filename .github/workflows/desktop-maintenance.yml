name: Build vault maintenance releases
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libpulse0 libasound2t64
      - run: python -m pip install -r requirements-build.txt
      - run: python tests/run_portable_checks.py
      - run: python tests/checks/test_mint_package.py
      - run: python packaging/build-mint.py --work-dir build-linux --output-dir dist-linux
      - uses: actions/upload-artifact@v4
        with:
          name: wormwright-vault-linux-0.3.5
          path: dist-linux/*
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python tests/run_portable_checks.py
      - run: python packaging/build-windows.py
      - run: python tests/smoke_windows_bundle.py build-windows/bundle/WormwrightVault/WormwrightVault.exe
      - name: Stage and compile installer
        shell: pwsh
        run: |
          New-Item installer-input -ItemType Directory -Force
          Copy-Item build-windows/bundle/WormwrightVault installer-input/WormwrightVault -Recurse -Force
          $compiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' } }
          & $compiler packaging/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - run: python tests/check_windows_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: wormwright-vault-windows-0.3.5
          path: |
            dist-windows/*
            dist-installer/*
          if-no-files-found: error
