name: Windows 0.3.2 preview
on:
  workflow_dispatch:
  push:
    branches: ['windows/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'assets/**', 'packaging/**', 'requirements*.txt', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - name: Dummy vault and sync checks
        run: python tests/run_portable_checks.py
      - name: Package Windows preview
        run: python packaging/build-windows.py
      - name: Test packaged app startup
        run: python tests/smoke_windows_bundle.py build-windows/bundle/WormwrightVault/WormwrightVault.exe
      - uses: actions/upload-artifact@v4
        with:
          name: wormwright-vault-0.3.2-windows-x64-preview2
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 14
