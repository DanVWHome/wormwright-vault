name: Android opening and editor UI regression
on:
  workflow_dispatch:
    inputs:
      app:
        description: Phone app to verify
        type: choice
        default: all
        options: [all, pocket, nas]
      confirmation_only:
        description: Run the focused Pocket confirmation dialog checks
        type: boolean
        default: false
      editors_only:
        description: Run focused password editor checks in the selected apps
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile instrumented debug builds without publisher credentials
        env:
          WORMWRIGHT_BUILD_PYTHON: python
          TEST_APP: ${{ inputs.app || 'all' }}
          CONFIRMATION_ONLY: ${{ inputs.confirmation_only || false }}
          EDITORS_ONLY: ${{ inputs.editors_only || false }}
        run: |
          sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'emulator' 'system-images;android-36;default;x86_64'
          if [ "$TEST_APP" != nas ]; then gradle -p android-standalone assembleDebug assembleDebugAndroidTest lintDebug; fi
          if [ "$TEST_APP" != pocket ]; then gradle -p android assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest; fi
          gradle --stop
      - name: Enable isolated emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android regression tests on invented samples
        timeout-minutes: 25
        env:
          TEST_APP: ${{ inputs.app || 'all' }}
          CONFIRMATION_ONLY: ${{ inputs.confirmation_only || false }}
          EDITORS_ONLY: ${{ inputs.editors_only || false }}
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/regression-avd"
          mkdir -p "$ANDROID_AVD_HOME" regression-results
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n regression -k 'system-images;android-36;default;x86_64' --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -avd regression -accel on -memory 4096 -cores 2 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > regression-results/emulator.txt 2>&1 &
          adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell svc power stayon true
          adb shell settings put system screen_off_timeout 1800000
          adb shell input keyevent 224
          adb shell input keyevent 82
          adb shell locksettings set-pin 246813
          adb shell input keyevent 224
          if [ "$TEST_APP" != nas ]; then
            adb install android-standalone/app/build/outputs/apk/debug/app-debug.apk
            adb install android-standalone/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          fi
          if [ "$TEST_APP" != pocket ]; then
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          fi
          adb shell am force-stop com.android.launcher3
          python - <<'PYTEST'
          from pathlib import Path
          import subprocess,os
          targets=[('pocket','ai.wormwright.vault.standalone.test/ai.wormwright.pocket.UiRegressionInstrumentation'),('nas','ai.wormwright.vault.preview.test/ai.wormwright.vault.UiRegressionInstrumentation')]
          for name,target in targets:
              if os.environ.get('TEST_APP','all') not in ('all',name):continue
              command=['adb','shell','am','instrument','-w']
              if name=='pocket' and os.environ.get('CONFIRMATION_ONLY')=='true':command+=['-e','confirmationOnly','true']
              if os.environ.get('EDITORS_ONLY')=='true':command+=['-e','editorsOnly','true']
              result=subprocess.run(command+[target],capture_output=True,text=True,timeout=900 if name=='pocket' else 420)
              output=result.stdout+result.stderr
              Path('regression-results/'+name+'.txt').write_text(output)
              print(output)
              assert result.returncode==0 and 'PASS opening spinner/' in output, name+' UI regression failed'
          PYTEST
      - name: Capture diagnostics without disabling screenshot protection
        if: always()
        run: |
          mkdir -p regression-results
          "$ANDROID_HOME/platform-tools/adb" logcat -d > regression-results/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-regression-results
          path: regression-results/
