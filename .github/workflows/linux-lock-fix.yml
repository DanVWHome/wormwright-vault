name: Build Linux vault maintenance release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libpulse0 libasound2t64
      - run: python -m pip install -r requirements-build.txt
      - run: python tests/run_portable_checks.py
      - run: python tests/checks/test_mint_package.py
      - run: python packaging/build-mint.py --work-dir build-linux --output-dir dist-linux
      - uses: actions/upload-artifact@v4
        with:
          name: wormwright-vault-linux-0.3.6
          path: dist-linux/*
          if-no-files-found: error
