name: Linux NAS lock fix preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c78d5a51db6bbfb828473c2b7e4b8f0a0c44cad0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libpulse0 libasound2t64
          python -m pip install -r requirements-build.txt
      - name: Synthetic sync and compatibility checks
        run: |
          python tests/run_portable_checks.py
          python tests/checks/test_mint_package.py
      - name: Mark the Linux test package
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/version.py')
          s = p.read_text().replace("VERSION = '0.3.2'", "VERSION = '0.3.2+lockfix.1'")
          s = s.replace("else 'Linux Mint release'", "else 'Linux Mint lock-fix preview'")
          p.write_text(s)
          PY
      - name: Build Mint preview
        run: python packaging/build-mint.py --work-dir build-linux --output-dir dist-linux
      - name: Include corresponding source and checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, zipfile
          output = Path('dist-linux')
          with zipfile.ZipFile(output / 'wormwright-vault-lockfix-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
                  if Path(name).is_file(): z.write(name, name)
          (output / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in sorted(output.iterdir()) if p.is_file()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wormwright-vault-linux-lockfix-preview
          path: dist-linux/*
          retention-days: 14
          if-no-files-found: error
