name: Publish Linux lock-fix prerelease
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require successful candidate build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/DanVWHome/wormwright-vault/actions/runs/37857268308 --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          name: wormwright-vault-linux-lockfix-preview
          path: candidate
          run-id: 37857268308
          github-token: ${{ github.token }}
      - name: Verify candidate files and package identity
        run: |
          cd candidate
          sha256sum --check SHA256SUMS
          test "$(dpkg-deb --field wormwright-vault-mint_0.3.2+lockfix.1_amd64.deb Package)" = wormwright-vault-mint
          test "$(dpkg-deb --field wormwright-vault-mint_0.3.2+lockfix.1_amd64.deb Version)" = 0.3.2+lockfix.1
          test "$(dpkg-deb --field wormwright-vault-mint_0.3.2+lockfix.1_amd64.deb Architecture)" = amd64
      - name: Publish prerelease without replacing latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.2-lockfix-preview.1 candidate/* --repo DanVWHome/wormwright-vault --target c78d5a51db6bbfb828473c2b7e4b8f0a0c44cad0 --title "Linux Mint NAS lock-fix preview 1" --notes-file docs/releases/linux-lockfix-preview-1.md --prerelease --latest=false
