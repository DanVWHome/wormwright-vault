name: Build and publish Windows 0.3.11 stable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python tests/run_portable_checks.py
      - run: python -m unittest discover -s tests/multikey -p "test_*.py"
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python packaging/build-windows.py
      - run: python tests/smoke_windows_bundle.py build-windows/bundle/WormwrightVault/WormwrightVault.exe
      - name: Compile installer
        shell: pwsh
        run: |
          New-Item installer-input -ItemType Directory -Force
          Copy-Item build-windows/bundle/WormwrightVault installer-input/WormwrightVault -Recurse -Force
          $compiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' } }
          & $compiler packaging/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - run: python tests/check_windows_icons.py build-windows/bundle/WormwrightVault/WormwrightVault.exe dist-installer/wormwright-vault_0.3.11_windows_x64_setup.exe
      - run: python tests/check_windows_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-stable-0.3.11
          path: |
            dist-windows/*.zip
            dist-installer/*_setup.exe
          if-no-files-found: error
  publish:
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-stable-0.3.11
          path: release-windows
      - name: Publish checked installer, portable ZIP and matching source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/publish-windows-stable.py
