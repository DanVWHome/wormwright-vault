name: Website demo screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tests/website/capture_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-website-screenshots
          path: screenshots/*.png
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: python -m pip install PyNaCl
      - run: python tests/website/prepare_android.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            cd android && gradle connectedDebugAndroidTest
            mkdir -p ../screenshots
            adb pull /sdcard/Android/data/ai.wormwright.vault.preview/files/screenshots ../screenshots/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-website-screenshots
          path: screenshots/**/*.png
          if-no-files-found: error
